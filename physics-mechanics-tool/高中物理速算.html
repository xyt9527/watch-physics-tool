<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高中物理速算</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231a2029'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='%234f8ef7' font-family='sans-serif'>F</text></svg>">
<style>
:root{
  --bg:#0f1319; --panel:#1a2029; --panel2:#222a35; --line:#2e3744;
  --text:#e6ecf2; --sub:#9aa6b4; --accent:#4f8ef7; --accent-soft:rgba(79,142,247,.14);
  --good:#57c98a; --warn:#e8b45f; --bad:#ef7d6b; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5}
#app{max-width:480px;margin:0 auto;padding:14px 14px 32px;min-height:100vh}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.topbar h1{font-size:19px;font-weight:700}
.back-btn,.ghost-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;min-height:40px}
.back-btn{color:var(--accent)}

.module-list{display:flex;flex-direction:column;gap:12px}
.module-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;cursor:pointer}
.module-card .m-name{font-size:16px;font-weight:600;margin-bottom:4px}
.module-card .m-intro{color:var(--sub);font-size:13px}
.module-card .m-count{margin-top:8px;color:var(--accent);font-size:12px}

.detail-head{margin-bottom:14px}
.detail-head .d-name{font-size:18px;font-weight:700}
.detail-head .d-intro{color:var(--sub);font-size:13px;margin-top:2px}

.formula-list{display:flex;flex-direction:column;gap:12px}
.formula-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.formula-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.formula-name{font-size:15px;font-weight:600;color:var(--sub)}
.conv-link{flex:none;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);border-radius:9px;padding:5px 10px;font-size:13px;min-height:36px}
.expr{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:17px;font-weight:600;color:#cfe3ff;margin:4px 0 10px;overflow-wrap:break-word}
.symbols{display:flex;flex-direction:column;gap:5px;font-size:13px}
.sym-row{display:grid;grid-template-columns:56px 1fr auto;gap:8px}
.sym-row .sym{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent)}
.sym-row .sym-unit{color:var(--sub);text-align:right}
.condition{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);color:var(--sub);font-size:12.5px}

.const-table{display:flex;flex-direction:column;gap:10px}
.const-row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px}
.const-row .c-symbol{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent);font-weight:600}
.const-row .c-value{font-weight:600}
.const-row .c-note{grid-column:2/4;color:var(--sub);font-size:12px}
.const-row .c-unit{color:var(--sub)}
.const-hint{margin-top:14px;color:var(--sub);font-size:12.5px}

/* 弹窗：单位选择 + 代入计算 + 结果 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-mask.open{display:flex}
.modal-wrap{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:86vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.modal-title{font-size:15px;font-weight:600;color:var(--accent);line-height:1.35}
.modal-close{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 11px;font-size:13px;min-height:36px}
#modalBody{display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.in-row{display:grid;grid-template-columns:96px 1fr;gap:8px}
.field select,.field input{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:16px;padding:9px 10px;min-height:44px;width:100%}
.field select:focus,.field input:focus{outline:none;border-color:var(--accent)}
.calc-btn{width:100%;margin-top:14px;background:var(--accent);border:none;border-radius:11px;color:#fff;font-size:15px;font-weight:600;padding:12px;min-height:46px}
.calc-result{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px;min-height:44px;display:flex;flex-direction:column;gap:6px}
.result-line{color:var(--good)}
.result-line .r-unit{color:var(--sub);margin-left:6px}
.error{color:var(--bad)}

/* ---------- 进入动画（默认开启；系统关闭动效时停用） ---------- */
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
@keyframes resultFlash{0%{background:var(--accent-soft)}100%{background:var(--bg)}}

#app{animation:pageIn .4s ease backwards}
.module-card,.formula-card,.const-row{animation:riseIn .45s ease backwards;animation-delay:calc(var(--i,0)*40ms)}
.modal-mask.open{animation:maskIn .22s ease backwards}
.modal-mask.open .modal-wrap{animation:modalIn .3s cubic-bezier(.2,.8,.25,1) backwards}
.calc-result.flash{animation:resultFlash .6s ease}
.calc-btn{transition:transform .12s ease}
.calc-btn:active{transform:scale(.97)}

@media (prefers-reduced-motion: reduce){
  #app,.module-card,.formula-card,.const-row,.modal-wrap,.modal-mask,.calc-result.flash{animation:none !important}
  .calc-btn{transition:none}
}

@media (min-width:768px){ #app{max-width:520px} }
</style>
</head>
<body>
<div id="app"></div>

<div class="modal-mask" id="modalMask">
  <div class="modal-wrap" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" id="modalClose" type="button">关闭</button>
    </div>
    <div id="modalBody"></div>
    <button class="calc-btn" id="modalCalc" type="button">计算</button>
    <div class="calc-result" id="modalResult">—</div>
  </div>
</div>

<script>
/* ================= 数据 ================= */
const MODULES = [
  {
    id: 'm1', name: '运动学', intro: '匀变速直线运动与自由落体的基本规律。',
    formulas: [
      {
        name: '速度公式', expr: 'v = v₀ + at',
        symbols: [['v', '末速度', 'm/s'], ['v₀', '初速度', 'm/s'], ['a', '加速度', 'm/s²'], ['t', '时间', 's']],
        condition: '匀变速直线运动；a 与 v₀ 同向取正，反向取负。',
        conv: ['时间', '长度', '速度'],
        calc: {
          inputs: [{ key: 'v0', label: '初速度 v₀', unit: 'm/s' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }, { key: 't', label: '时间 t', unit: 's' }],
          outputs: [{ key: 'v', label: '末速度 v', unit: 'm/s' }],
          fn: i => ({ v: i.v0 + i.a * i.t })
        }
      },
      {
        name: '位移公式', expr: 'x = v₀t + ½at²',
        symbols: [['x', '位移', 'm'], ['v₀', '初速度', 'm/s'], ['a', '加速度', 'm/s²'], ['t', '时间', 's']],
        condition: '匀变速直线运动。',
        conv: ['长度', '时间'],
        calc: {
          inputs: [{ key: 'v0', label: '初速度 v₀', unit: 'm/s' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }, { key: 't', label: '时间 t', unit: 's' }],
          outputs: [{ key: 'x', label: '位移 x', unit: 'm' }],
          fn: i => ({ x: i.v0 * i.t + 0.5 * i.a * i.t * i.t })
        }
      },
      {
        name: '速度—位移关系', expr: 'v² − v₀² = 2ax',
        symbols: [['v', '末速度', 'm/s'], ['v₀', '初速度', 'm/s'], ['a', '加速度', 'm/s²'], ['x', '位移', 'm']],
        condition: '不含时间 t 时使用；根号内为负说明该速度不可能达到。',
        conv: ['长度', '速度'],
        calc: {
          inputs: [{ key: 'v0', label: '初速度 v₀', unit: 'm/s' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }, { key: 'x', label: '位移 x', unit: 'm' }],
          outputs: [{ key: 'v', label: '末速度 v', unit: 'm/s' }],
          fn: i => ({ v: Math.sqrt(i.v0 * i.v0 + 2 * i.a * i.x) })
        }
      },
      {
        name: '平均速度', expr: 'v̄ = (v₀ + v) / 2 = x / t',
        symbols: [['v̄', '平均速度', 'm/s'], ['v₀', '初速度', 'm/s'], ['v', '末速度', 'm/s']],
        condition: '仅适用于匀变速直线运动。',
        conv: ['速度'],
        calc: {
          inputs: [{ key: 'v0', label: '初速度 v₀', unit: 'm/s' }, { key: 'v', label: '末速度 v', unit: 'm/s' }],
          outputs: [{ key: 'vbar', label: '平均速度 v̄', unit: 'm/s' }],
          fn: i => ({ vbar: (i.v0 + i.v) / 2 })
        }
      },
      {
        name: '自由落体', expr: 'v = gt，h = ½gt²',
        symbols: [['v', '落地速度', 'm/s'], ['h', '下落高度', 'm'], ['t', '下落时间', 's'], ['g', '重力加速度', 'm/s²']],
        condition: '初速度为 0、只受空气阻力可忽略的重力；g 默认 9.8，题目要求时取 10。',
        conv: ['长度', '时间', '速度'],
        calc: {
          inputs: [{ key: 't', label: '下落时间 t', unit: 's' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'h', label: '下落高度 h', unit: 'm' }, { key: 'v', label: '落地速度 v', unit: 'm/s' }],
          fn: i => ({ h: 0.5 * i.g * i.t * i.t, v: i.g * i.t })
        }
      }
    ]
  },
  {
    id: 'm2', name: '相互作用', intro: '重力、弹力、摩擦力与力的合成分解。',
    formulas: [
      {
        name: '重力', expr: 'G = mg',
        symbols: [['G', '重力', 'N'], ['m', '质量', 'kg'], ['g', '重力加速度', 'm/s²']],
        condition: '在地球表面附近。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'G', label: '重力 G', unit: 'N' }],
          fn: i => ({ G: i.m * i.g })
        }
      },
      {
        name: '胡克定律', expr: 'F = kx',
        symbols: [['F', '弹力', 'N'], ['k', '劲度系数', 'N/m'], ['x', '形变量（伸长/压缩量）', 'm']],
        condition: 'x 是弹簧形变量，不是弹簧总长；在弹性限度内成立。',
        conv: ['长度', '力'],
        calc: {
          inputs: [{ key: 'k', label: '劲度系数 k', unit: 'N/m' }, { key: 'x', label: '形变量 x', unit: 'm' }],
          outputs: [{ key: 'F', label: '弹力 F', unit: 'N' }],
          fn: i => ({ F: i.k * i.x })
        }
      },
      {
        name: '滑动摩擦力', expr: 'f = μN',
        symbols: [['f', '滑动摩擦力', 'N'], ['μ', '动摩擦因数', '—'], ['N', '正压力', 'N']],
        condition: '接触面粗糙且发生相对滑动；N 是垂直于接触面的压力，不一定等于重力。',
        conv: ['力'],
        calc: {
          inputs: [{ key: 'mu', label: '动摩擦因数 μ', unit: '—' }, { key: 'N', label: '正压力 N', unit: 'N' }],
          outputs: [{ key: 'f', label: '摩擦力 f', unit: 'N' }],
          fn: i => ({ f: i.mu * i.N })
        }
      },
      {
        name: '力的合成（正交分解）', expr: 'F = √(Fx² + Fy²)',
        symbols: [['F', '合力大小', 'N'], ['Fx', '水平分力', 'N'], ['Fy', '竖直分力', 'N']],
        condition: '两个分力互相垂直时使用。',
        conv: ['力'],
        calc: {
          inputs: [{ key: 'Fx', label: '水平分力 Fx', unit: 'N' }, { key: 'Fy', label: '竖直分力 Fy', unit: 'N' }],
          outputs: [{ key: 'F', label: '合力 F', unit: 'N' }],
          fn: i => ({ F: Math.sqrt(i.Fx * i.Fx + i.Fy * i.Fy) })
        }
      },
      {
        name: '斜面重力分力', expr: 'G₁ = mg·sinθ，G₂ = mg·cosθ',
        symbols: [['G₁', '沿斜面分力', 'N'], ['G₂', '垂直斜面分力', 'N'], ['m', '质量', 'kg'], ['θ', '斜面倾角', '°']],
        condition: 'θ 为斜面与水平面的夹角。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'theta', label: '倾角 θ', unit: '°' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'G1', label: '沿斜面 G₁', unit: 'N' }, { key: 'G2', label: '垂直斜面 G₂', unit: 'N' }],
          fn: i => { const r = rad(i.theta); return { G1: i.m * i.g * Math.sin(r), G2: i.m * i.g * Math.cos(r) } }
        }
      }
    ]
  },
  {
    id: 'm3', name: '牛顿运动定律', intro: '第二定律、超重失重与第三定律。',
    formulas: [
      {
        name: '牛顿第二定律', expr: 'F合 = ma',
        symbols: [['F合', '合外力', 'N'], ['m', '质量', 'kg'], ['a', '加速度', 'm/s²']],
        condition: '加速度方向与合外力方向相同；F合 是所有外力的矢量和。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }],
          outputs: [{ key: 'F', label: '合外力 F合', unit: 'N' }],
          fn: i => ({ F: i.m * i.a })
        }
      },
      {
        name: '由力求加速度', expr: 'a = F合 / m',
        symbols: [['a', '加速度', 'm/s²'], ['F合', '合外力', 'N'], ['m', '质量', 'kg']],
        condition: '质量不能为 0。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'F', label: '合外力 F合', unit: 'N' }, { key: 'm', label: '质量 m', unit: 'kg' }],
          outputs: [{ key: 'a', label: '加速度 a', unit: 'm/s²' }],
          fn: i => ({ a: i.F / i.m })
        }
      },
      {
        name: '超重（加速上升 / 减速下降）', expr: 'N = m(g + a)',
        symbols: [['N', '支持力（视重）', 'N'], ['m', '质量', 'kg'], ['a', '加速度大小', 'm/s²'], ['g', '重力加速度', 'm/s²']],
        condition: '加速度方向向上时处于超重状态，N 大于 mg。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'N', label: '支持力 N', unit: 'N' }],
          fn: i => ({ N: i.m * (i.g + i.a) })
        }
      },
      {
        name: '失重（加速下降 / 减速上升）', expr: 'N = m(g − a)',
        symbols: [['N', '支持力（视重）', 'N'], ['m', '质量', 'kg'], ['a', '加速度大小', 'm/s²'], ['g', '重力加速度', 'm/s²']],
        condition: '加速度方向向下时处于失重状态；a = g 为完全失重。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'N', label: '支持力 N', unit: 'N' }],
          fn: i => ({ N: i.m * (i.g - i.a) })
        }
      },
      {
        name: '牛顿第三定律', expr: '作用力 = 反作用力',
        symbols: [['—', '大小相等、方向相反', '—'], ['—', '作用在两个不同物体上', '—']],
        condition: '作用力与反作用力不能相互平衡；平衡力作用在同一物体上，注意区分。',
        conv: [],
        calc: null
      }
    ]
  },
  {
    id: 'm4', name: '曲线运动', intro: '平抛运动与圆周运动规律。',
    formulas: [
      {
        name: '平抛：水平方向', expr: 'x = v₀t',
        symbols: [['x', '水平位移', 'm'], ['v₀', '水平初速度', 'm/s'], ['t', '运动时间', 's']],
        condition: '水平方向匀速直线运动。',
        conv: ['长度', '时间', '速度'],
        calc: {
          inputs: [{ key: 'v0', label: '水平初速度 v₀', unit: 'm/s' }, { key: 't', label: '时间 t', unit: 's' }],
          outputs: [{ key: 'x', label: '水平位移 x', unit: 'm' }],
          fn: i => ({ x: i.v0 * i.t })
        }
      },
      {
        name: '平抛：竖直方向', expr: 'y = ½gt²，v_y = gt',
        symbols: [['y', '竖直下落距离', 'm'], ['v_y', '竖直分速度', 'm/s'], ['t', '运动时间', 's'], ['g', '重力加速度', 'm/s²']],
        condition: '竖直方向自由落体。',
        conv: ['长度', '时间', '速度'],
        calc: {
          inputs: [{ key: 't', label: '时间 t', unit: 's' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'y', label: '竖直距离 y', unit: 'm' }, { key: 'vy', label: '竖直速度 v_y', unit: 'm/s' }],
          fn: i => ({ y: 0.5 * i.g * i.t * i.t, vy: i.g * i.t })
        }
      },
      {
        name: '平抛：合速度', expr: 'v = √(v₀² + v_y²)，tanθ = v_y / v₀',
        symbols: [['v', '合速度', 'm/s'], ['v₀', '水平初速度', 'm/s'], ['v_y', '竖直分速度', 'm/s'], ['θ', '速度与水平方向夹角', '°']],
        condition: 'θ 为合速度方向与水平方向的夹角。',
        conv: ['速度'],
        calc: {
          inputs: [{ key: 'v0', label: '水平初速度 v₀', unit: 'm/s' }, { key: 'vy', label: '竖直速度 v_y', unit: 'm/s' }],
          outputs: [{ key: 'v', label: '合速度 v', unit: 'm/s' }, { key: 'tan', label: 'tanθ', unit: '—' }],
          fn: i => ({ v: Math.sqrt(i.v0 * i.v0 + i.vy * i.vy), tan: i.vy / i.v0 })
        }
      },
      {
        name: '圆周：线速度与角速度', expr: 'v = ωr',
        symbols: [['v', '线速度', 'm/s'], ['ω', '角速度', 'rad/s'], ['r', '圆周半径', 'm']],
        condition: '匀速圆周运动。',
        conv: ['长度', '速度'],
        calc: {
          inputs: [{ key: 'w', label: '角速度 ω', unit: 'rad/s' }, { key: 'r', label: '半径 r', unit: 'm' }],
          outputs: [{ key: 'v', label: '线速度 v', unit: 'm/s' }],
          fn: i => ({ v: i.w * i.r })
        }
      },
      {
        name: '向心加速度', expr: 'aₙ = v²/r = ω²r',
        symbols: [['aₙ', '向心加速度', 'm/s²'], ['v', '线速度', 'm/s'], ['r', '圆周半径', 'm']],
        condition: '方向指向圆心，只改变速度方向。',
        conv: ['长度', '速度'],
        calc: {

        symbols: [['p₁、p₂', '初、末态压强', 'Pa'], ['T₁、T₂', '初、末态热力学温度', 'K']],
        condition: '体积不变；压强与热力学温度成正比。',
        conv: ['压强'],
        calc: {
          inputs: [{ key: 'p1', label: '压强 p₁', unit: 'Pa' }, { key: 'T1', label: '温度 T₁', unit: 'K' }, { key: 'T2', label: '温度 T₂', unit: 'K' }],
          outputs: [{ key: 'p2', label: '压强 p₂', unit: 'Pa' }],
          fn: i => ({ p2: i.p1 * i.T2 / i.T1 })
        }
      },
      {
        name: '等压变化（盖-吕萨克定律）', expr: 'V₁/T₁ = V₂/T₂',
        symbols: [['V₁、V₂', '初、末态体积', 'm³'], ['T₁、T₂', '初、末态热力学温度', 'K']],
        condition: '压强不变；体积与热力学温度成正比。',
        conv: ['体积'],
        calc: {
          inputs: [{ key: 'V1', label: '体积 V₁', unit: 'm³' }, { key: 'T1', label: '温度 T₁', unit: 'K' }, { key: 'T2', label: '温度 T₂', unit: 'K' }],
          outputs: [{ key: 'V2', label: '体积 V₂', unit: 'm³' }],
          fn: i => ({ V2: i.V1 * i.T2 / i.T1 })
        }
      },
      {
        name: '热力学第一定律', expr: 'ΔU = Q + W',
        symbols: [['ΔU', '内能变化', 'J'], ['Q', '吸收的热量', 'J'], ['W', '外界对气体做的功', 'J']],
        condition: '符号约定：吸热 Q 为正，外界对气体做功 W 为正；ΔU 为正表示内能增加。',
        conv: ['能量'],
        calc: {
          inputs: [{ key: 'Q', label: '热量 Q', unit: 'J' }, { key: 'W', label: '做功 W', unit: 'J' }],
          outputs: [{ key: 'dU', label: '内能变化 ΔU', unit: 'J' }],
          fn: i => ({ dU: i.Q + i.W })
        }
      }
    ]
  },
  {
    id: 'm17', name: '原子物理', intro: '光子能量、光电效应、物质波与质能方程。',
    formulas: [
      {
        name: '光子能量', expr: 'E = hν = hc / λ',
        symbols: [['E', '光子能量', 'J'], ['h', '普朗克常量', 'J·s'], ['ν', '频率', 'Hz'], ['c', '真空光速', 'm/s'], ['λ', '波长', 'm']],
        condition: '光由一份一份的光子组成；频率越高光子能量越大。',
        conv: ['能量', '频率', '波长'],
        calc: {
          inputs: [{ key: 'lambda', label: '波长 λ', unit: 'm' }],
          outputs: [{ key: 'E', label: '光子能量 E', unit: 'J' }],
          fn: i => ({ E: 6.63e-34 * 3.0e8 / i.lambda })
        }
      },
      {
        name: '光电效应方程', expr: 'Eₖ = hν − W₀',
        symbols: [['Eₖ', '光电子最大初动能', 'J'], ['hν', '光子能量', 'J'], ['W₀', '逸出功', 'J']],
        condition: '入射光频率大于截止频率才发生光电效应；与光强无关。',
        conv: ['能量'],
        calc: {
          inputs: [{ key: 'hnu', label: '光子能量 hν', unit: 'J' }, { key: 'W0', label: '逸出功 W₀', unit: 'J' }],
          outputs: [{ key: 'Ek', label: '最大初动能 Eₖ', unit: 'J' }],
          fn: i => ({ Ek: i.hnu - i.W0 })
        }
      },
      {
        name: '德布罗意波长', expr: 'λ = h / p = h / (mv)',
        symbols: [['λ', '物质波波长', 'm'], ['h', '普朗克常量', 'J·s'], ['p', '动量', 'kg·m/s'], ['m', '质量', 'kg'], ['v', '速度', 'm/s']],
        condition: '一切运动的微观粒子都具有波粒二象性。',
        conv: ['质量', '速度', '长度'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'v', label: '速度 v', unit: 'm/s' }],
          outputs: [{ key: 'lambda', label: '波长 λ', unit: 'm' }],
          fn: i => ({ lambda: 6.63e-34 / (i.m * i.v) })
        }
      },
      {
        name: '质能方程', expr: 'E = mc²',
        symbols: [['E', '能量', 'J'], ['m', '质量', 'kg'], ['c', '真空光速', 'm/s']],
        condition: '质量与能量相互联系；质量亏损对应释放核能。',
        conv: ['质量', '能量'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }],
          outputs: [{ key: 'E', label: '能量 E', unit: 'J' }],
          fn: i => ({ E: i.m * 3.0e8 * 3.0e8 })
        }
      },
      {
        name: '质量亏损与核能', expr: 'ΔE = Δm · c²',
        symbols: [['ΔE', '释放核能', 'J'], ['Δm', '质量亏损', 'kg']],
        condition: '核反应前后的质量之差乘以光速平方即释放的能量。',
        conv: ['质量', '能量'],
        calc: {
          inputs: [{ key: 'dm', label: '质量亏损 Δm', unit: 'kg' }],
          outputs: [{ key: 'dE', label: '核能 ΔE', unit: 'J' }],
          fn: i => ({ dE: i.dm * 3.0e8 * 3.0e8 })
        }
      },
      {
        name: '半衰期', expr: 'N = N₀ · (1/2)^(t/T)',
        symbols: [['N', '剩余原子核数', '—'], ['N₀', '原有原子核数', '—'], ['T', '半衰期', '—'], ['t', '经历时间', '—']],
        condition: '由原子核本身决定，与温度、压强、化学状态无关；对大量原子核统计成立。',
        conv: [],
        calc: null
      }
    ]
  }
]

const CONSTANTS = [
  ['g', '9.8', 'm/s²', '重力加速度；题目未说明时常取 10'],
  ['G', '6.67×10⁻¹¹', 'N·m²/kg²', '万有引力常量'],
  ['M地', '5.97×10²⁴', 'kg', '地球质量'],
  ['R地', '6.37×10⁶', 'm', '地球平均半径'],
  ['k', '9.0×10⁹', 'N·m²/C²', '静电力常量（库仑定律）'],
  ['e', '1.60×10⁻¹⁹', 'C', '元电荷'],
  ['h', '6.63×10⁻³⁴', 'J·s', '普朗克常量'],
  ['c', '3.00×10⁸', 'm/s', '真空中光速'],
  ['N_A', '6.02×10²³', 'mol⁻¹', '阿伏伽德罗常数']
]

const UNITS = {
  '长度': { units: { 'km': 1000, 'm': 1, 'cm': 0.01, 'mm': 0.001 } },
  '质量': { units: { 't': 1000, 'kg': 1, 'g': 0.001, 'mg': 1e-6 } },
  '时间': { units: { 'h': 3600, 'min': 60, 's': 1 } },
  '力': { units: { 'kN': 1000, 'N': 1 } },
  '能量': { units: { 'kJ': 1000, 'J': 1, 'eV': 1.602e-19 } },
  '速度': { units: { 'm/s': 1, 'km/h': 1 / 3.6 } },
  '功率': { units: { 'kW': 1000, 'W': 1 } },
  '动量/冲量': { units: { 'kg·m/s': 1, 'N·s': 1 } },
  '电荷量': { units: { 'C': 1, 'mC': 1e-3, 'μC': 1e-6 } },
  '电压': { units: { 'kV': 1000, 'V': 1, 'mV': 1e-3 } },
  '电容': { units: { 'F': 1, 'μF': 1e-6, 'nF': 1e-9, 'pF': 1e-12 } },
  '电阻': { units: { 'MΩ': 1e6, 'kΩ': 1e3, 'Ω': 1 } },
  '电流': { units: { 'A': 1, 'mA': 1e-3 } },
  '磁感应强度': { units: { 'T': 1, 'mT': 1e-3 } },
  '磁通量': { units: { 'Wb': 1 } },
  '频率': { units: { 'MHz': 1e6, 'kHz': 1e3, 'Hz': 1 } },
  '波长': { units: { 'μm': 1e-6, 'nm': 1e-9 } },
  '压强': { units: { 'kPa': 1000, 'Pa': 1, 'atm': 1.013e5 } },
  '体积': { units: { 'm³': 1, 'L': 1e-3, 'mL': 1e-6 } },
  '物质的量': { units: { 'mol': 1 } }
}

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rad = d => d * Math.PI / 180;
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : NaN; };
function fmt(n){ if(!Number.isFinite(n)) return '—'; const a=Math.abs(n); if(a!==0 && (a>=1e6 || a<1e-3)) return n.toExponential(3).replace(/\.?0+e/,'e'); return String(Number(n.toPrecision(4))); }

function unitCategory(unit){
  if(['m/s','km/h'].includes(unit)) return '速度';
  if(['m','km','cm','mm'].includes(unit)) return '长度';
  if(['s','min','h'].includes(unit)) return '时间';
  if(['kg','g','t','mg'].includes(unit)) return '质量';
  if(['N','kN'].includes(unit)) return '力';
  if(['J','kJ','eV'].includes(unit)) return '能量';
  if(['W','kW'].includes(unit)) return '功率';
  if(['kg·m/s','N·s'].includes(unit)) return '动量/冲量';
  if(['C','mC','μC'].includes(unit)) return '电荷量';
  if(['kV','V','mV'].includes(unit)) return '电压';
  if(['F','μF','nF','pF'].includes(unit)) return '电容';
  if(['MΩ','kΩ','Ω'].includes(unit)) return '电阻';
  if(['A','mA'].includes(unit)) return '电流';
  if(['T','mT'].includes(unit)) return '磁感应强度';
  if(['Wb'].includes(unit)) return '磁通量';
  if(['MHz','kHz','Hz'].includes(unit)) return '频率';
  if(['μm','nm'].includes(unit)) return '波长';
  if(['kPa','Pa','atm'].includes(unit)) return '压强';
  if(['m³','L','mL'].includes(unit)) return '体积';
  if(['mol'].includes(unit)) return '物质的量';
  return null;
}
function factor(cat, unit){ const u=UNITS[cat]; return u && u.units[unit] ? u.units[unit] : 1; }
function unitOptions(cat, fallback){
  if(!cat || !UNITS[cat]) return [fallback];
  return Object.keys(UNITS[cat].units);
}

const state = { view:'list', moduleId:null, modal:null };

function findFormula(mid, fi){ const m=MODULES.find(x=>x.id===mid); return m ? m.formulas[fi] : null; }

/* ---------- 主视图渲染 ---------- */
function render(){
  const app=$('app');
  if(state.view==='list') app.innerHTML = renderList();
  else if(state.view==='module') app.innerHTML = renderDetail();
  else if(state.view==='const') app.innerHTML = renderConst();
}

function renderList(){
  const cards = MODULES.map((m,i)=>`
    <div class="module-card" style="--i:${i}" onclick="goModule('${m.id}')">
      <div class="m-name">${esc(m.name)}</div>
      <div class="m-intro">${esc(m.intro)}</div>
      <div class="m-count">${m.formulas.length} 条公式</div>
    </div>`).join('');
  return `
    <div class="topbar">
      <h1>高中物理速算</h1>
      <button class="ghost-btn" type="button" onclick="goConst()">常量</button>
    </div>
    <div class="module-list">${cards}</div>`;
}

function renderDetail(){
  const m=MODULES.find(x=>x.id===state.moduleId);
  if(!m){ state.view='list'; return renderList(); }
  const cards = m.formulas.map((f,fi)=>{
    const btn = f.calc ? `<button class="conv-link" type="button" onclick="openCalc('${m.id}',${fi})">换算 / 计算</button>` : '';
    const sym = f.symbols.map(s=>`<div class="sym-row"><span class="sym">${esc(s[0])}</span><span>${esc(s[1])}</span><span class="sym-unit">${esc(s[2])}</span></div>`).join('');
    return `
    <div class="formula-card" style="--i:${fi}">
      <div class="formula-head"><div class="formula-name">${esc(f.name)}</div>${btn}</div>
      <div class="expr">${esc(f.expr)}</div>
      <div class="symbols">${sym}</div>
      <div class="condition">${esc(f.condition)}</div>
    </div>`;
  }).join('');
  return `
    <div class="topbar">
      <button class="back-btn" type="button" onclick="goList()">← 返回模块</button>
      <button class="ghost-btn" type="button" onclick="goConst()">常量</button>
    </div>
    <div class="detail-head"><div class="d-name">${esc(m.name)}</div><div class="d-intro">${esc(m.intro)}</div></div>
    <div class="formula-list">${cards}</div>`;
}

function renderConst(){
  const rows = CONSTANTS.map((c,ci)=>`
    <div class="const-row" style="--i:${ci}">
      <span class="c-symbol">${esc(c[0])}</span>
      <span class="c-value">${esc(c[1])}</span>
      <span class="c-unit">${esc(c[2])}</span>
      <span class="c-note">${esc(c[3])}</span>
    </div>`).join('');
  return `
    <div class="topbar"><button class="back-btn" type="button" onclick="goList()">← 返回模块</button></div>
    <div class="detail-head"><div class="d-name">常用常量</div></div>
    <div class="const-table">${rows}</div>
    <div class="const-hint">单位换算与代入计算在各公式卡片右上角的「换算 / 计算」弹窗内进行。</div>`;
}

/* ---------- 导航 ---------- */
function goList(){ state.view='list'; state.moduleId=null; render(); }
function goModule(id){ state.view='module'; state.moduleId=id; render(); window.scrollTo(0,0); }
function goConst(){ state.view='const'; render(); window.scrollTo(0,0); }

/* ---------- 弹窗：换算 + 计算 ---------- */
function openCalc(mid, fi){
  const f=findFormula(mid,fi); if(!f||!f.calc) return;
  state.modal={mid,fi};
  $('modalTitle').textContent = `${f.name}｜${f.expr}`;
  const body = f.calc.inputs.map(inp=>{
    const cat=unitCategory(inp.unit);
    const opts=unitOptions(cat, inp.unit);
    const sel=opts.map(u=>`<option ${u===inp.unit?'selected':''}>${esc(u)}</option>`).join('');
    return `
    <div class="field">
      <label>${esc(inp.label)}（${esc(inp.unit)}）</label>
      <div class="in-row">
        <select data-unit="${esc(inp.key)}">${sel}</select>
        <input type="number" step="any" data-key="${esc(inp.key)}" placeholder="输入数值">
      </div>
    </div>`;
  }).join('');
  const outFields = f.calc.outputs.map(o=>{
    const cat=unitCategory(o.unit);
    const opts=unitOptions(cat, o.unit);
    const sel=opts.map(u=>`<option ${u===o.unit?'selected':''}>${esc(u)}</option>`).join('');
    return `
    <div class="field">
      <label>${esc(o.label)} 结果单位</label>
      <select data-out="${esc(o.key)}">${sel}</select>
    </div>`;
  }).join('');
  $('modalBody').innerHTML = body + outFields;
  $('modalResult').innerHTML = '<span style="color:var(--sub)">填入数值后点计算</span>';
  $('modalMask').classList.add('open');
}

function closeCalc(){ state.modal=null; $('modalMask').classList.remove('open'); }

function doCalc(){
  const {mid,fi}=state.modal; const f=findFormula(mid,fi); if(!f) return;
  const inputs={}; const errs=[];
  f.calc.inputs.forEach(inp=>{
    const raw=num(document.querySelector(`[data-key="${esc(inp.key)}"]`).value);
    if(Number.isNaN(raw)){ errs.push(inp.label); return; }
    const cat=unitCategory(inp.unit);
    const sel=document.querySelector(`[data-unit="${esc(inp.key)}"]`).value;
    inputs[inp.key]= raw * factor(cat, sel);
  });
  if(errs.length){ const b=$('modalResult'); b.classList.remove('flash'); b.innerHTML=`<span class="error">请填写：${errs.map(esc).join('、')}</span>`; return; }
  let out;
  try{ out=f.calc.fn(inputs); }catch(e){ const b=$('modalResult'); b.classList.remove('flash'); b.innerHTML='<span class="error">计算出错，请检查输入</span>'; return; }
  const lines = f.calc.outputs.map(o=>{
    const v=out[o.key];
    const cat=unitCategory(o.unit);
    const sel=document.querySelector(`[data-out="${esc(o.key)}"]`).value;
    const disp=Number.isFinite(v)? v/factor(cat,sel) : NaN;
    return `<div class="result-line">${esc(o.label)} = ${fmt(disp)}<span class="r-unit">${esc(sel)}</span></div>`;
  }).join('');
  const bad=f.calc.outputs.some(o=>!Number.isFinite(out[o.key]));
  const box=$('modalResult');
  box.innerHTML = bad ? '<span class="error">根号内为负或结果不可达，请检查输入</span>' : lines;
  if(!bad){ box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash'); }
}

/* ---------- 事件绑定 ---------- */
$('modalClose').addEventListener('click', closeCalc);
$('modalMask').addEventListener('click', e=>{ if(e.target===$('modalMask')) closeCalc(); });
$('modalCalc').addEventListener('click', doCalc);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeCalc(); });

render();
</script>
</body>
</html>
