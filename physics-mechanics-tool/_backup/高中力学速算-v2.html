<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高中力学速算 · 公式 / 计算 / 换算</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101318'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='%233b82f6' font-family='sans-serif' font-weight='700'%3E力%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #101318;
    --surface: #1a1f27;
    --surface-2: #232a34;
    --line: #2c3440;
    --text: #e8ecf1;
    --muted: #9aa5b1;
    --accent: #3b82f6;
    --accent-soft: #1e3a5f;
    --result: #f5b544;
    --danger: #e5604f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100%; padding: 18px 16px 28px; }

  /* 顶部栏 */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .topbar h1 { font-size: 20px; font-weight: 700; }
  .header { margin-bottom: 18px; }
  .header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .back-btn, .ghost-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; min-height: 40px;
  }
  .ghost-btn { color: var(--accent); border-color: var(--accent-soft); }
  .back-btn:active, .ghost-btn:active { background: var(--surface-2); }

  /* 列表 */
  .module-list { display: flex; flex-direction: column; gap: 12px; }
  .module-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; min-height: 44px;
  }
  .module-card:active { background: var(--surface-2); }
  .module-no {
    flex: 0 0 38px; height: 38px; border-radius: 12px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
  }
  .module-body { flex: 1; min-width: 0; }
  .module-body h2 { font-size: 16px; font-weight: 600; }
  .module-body p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .module-arrow { color: var(--muted); font-size: 18px; }

  .detail-title { font-size: 19px; font-weight: 700; }
  .detail-intro { color: var(--muted); font-size: 13px; margin: -8px 0 16px; }

  /* 公式卡片 */
  .formula-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 15px; margin-bottom: 14px; }
  .formula-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .formula-name { font-size: 13px; color: var(--muted); }
  .conv-link {
    background: none; border: 1px solid var(--accent-soft); color: var(--accent);
    border-radius: 9px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; min-height: 36px; white-space: nowrap;
  }
  .conv-link:active { background: var(--accent-soft); }
  .formula-expr { font-size: 19px; font-weight: 600; letter-spacing: 0.3px; margin-bottom: 10px; word-break: break-word; }
  .symbols { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .symbol { display: flex; gap: 8px; font-size: 13px; }
  .symbol .sym { flex: 0 0 64px; color: var(--accent); font-weight: 600; }
  .symbol .mean { flex: 1; color: var(--text); }
  .symbol .unit { flex: 0 0 84px; text-align: right; color: var(--muted); }
  .condition { font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }

  /* 计算器 */
  .calc { margin-top: 12px; background: var(--surface-2); border-radius: 12px; padding: 12px; }
  .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12.5px; color: var(--muted); }
  .field input, .field select, .conv-row input, .conv-row select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    color: var(--text); font-size: 16px; padding: 9px 10px; min-height: 44px; width: 100%;
  }
  .field input:focus, .field select:focus, .conv-row input:focus, .conv-row select:focus { outline: none; border-color: var(--accent); }
  .calc-btn {
    margin-top: 12px; width: 100%; min-height: 44px; border: none; border-radius: 11px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .calc-btn:active { opacity: 0.85; }
  .calc-result { margin-top: 10px; font-size: 14px; min-height: 22px; }
  .calc-result .ok { color: var(--result); font-weight: 700; }
  .calc-result .err { color: var(--danger); }

  /* 换算页 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .chip {
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; min-height: 40px;
  }
  .chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .conv-context { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px; margin-bottom: 14px; }
  .conv-context .expr { font-size: 17px; font-weight: 600; margin-top: 4px; }
  .conv-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 15px; }
  .conv-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .conv-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* 常量 */
  .const-table { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .const-row { display: grid; grid-template-columns: 1fr 1.2fr 0.9fr; padding: 12px 14px; border-top: 1px solid var(--line); font-size: 13px; }
  .const-row:first-child { border-top: none; }
  .const-row .k { color: var(--accent); font-weight: 600; }
  .const-row .v { color: var(--text); }
  .const-row .u { color: var(--muted); text-align: right; }
  .note-inline { color: var(--muted); font-size: 11.5px; }

  .note { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ================= 数据 ================= */
const MODULES = [
  {
    id: 'm1', name: '运动学', intro: '匀变速直线运动与自由落体的基本规律。',
    formulas: [
      {
        name: '速度公式', expr: 'v = v₀ + at',
        symbols: [['v', '末速度', 'm/s'], ['v₀', '初速度', 'm/s'], ['a', '加速度', 'm/s²'], ['t', '时间', 's']],
        condition: '匀变速直线运动；a 与 v₀ 同向取正，反向取负。',
        conv: ['时间', '长度', '速度'],
        calc: {
          inputs: [{ key: 'v0', label: '初速度 v₀', unit: 'm/s' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }, { key: 't', label: '时间 t', unit: 's' }],
          outputs: [{ key: 'v', label: '末速度 v', unit: 'm/s' }],
          fn: i => ({ v: i.v0 + i.a * i.t })
        }
      },
      {
        name: '位移公式', expr: 'x = v₀t + ½at²',
        symbols: [['x', '位移', 'm'], ['v₀', '初速度', 'm/s'], ['a', '加速度', 'm/s²'], ['t', '时间', 's']],
        condition: '匀变速直线运动。',
        conv: ['长度', '时间'],
        calc: {
          inputs: [{ key: 'v0', label: '初速度 v₀', unit: 'm/s' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }, { key: 't', label: '时间 t', unit: 's' }],
          outputs: [{ key: 'x', label: '位移 x', unit: 'm' }],
          fn: i => ({ x: i.v0 * i.t + 0.5 * i.a * i.t * i.t })
        }
      },
      {
        name: '速度—位移关系', expr: 'v² − v₀² = 2ax',
        symbols: [['v', '末速度', 'm/s'], ['v₀', '初速度', 'm/s'], ['a', '加速度', 'm/s²'], ['x', '位移', 'm']],
        condition: '不含时间 t 时使用；根号内为负说明该速度不可能达到。',
        conv: ['长度', '速度'],
        calc: {
          inputs: [{ key: 'v0', label: '初速度 v₀', unit: 'm/s' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }, { key: 'x', label: '位移 x', unit: 'm' }],
          outputs: [{ key: 'v', label: '末速度 v', unit: 'm/s' }],
          fn: i => ({ v: Math.sqrt(i.v0 * i.v0 + 2 * i.a * i.x) })
        }
      },
      {
        name: '平均速度', expr: 'v̄ = (v₀ + v) / 2 = x / t',
        symbols: [['v̄', '平均速度', 'm/s'], ['v₀', '初速度', 'm/s'], ['v', '末速度', 'm/s']],
        condition: '仅适用于匀变速直线运动。',
        conv: ['速度'],
        calc: {
          inputs: [{ key: 'v0', label: '初速度 v₀', unit: 'm/s' }, { key: 'v', label: '末速度 v', unit: 'm/s' }],
          outputs: [{ key: 'vbar', label: '平均速度 v̄', unit: 'm/s' }],
          fn: i => ({ vbar: (i.v0 + i.v) / 2 })
        }
      },
      {
        name: '自由落体', expr: 'v = gt，h = ½gt²',
        symbols: [['v', '落地速度', 'm/s'], ['h', '下落高度', 'm'], ['t', '下落时间', 's'], ['g', '重力加速度', 'm/s²']],
        condition: '初速度为 0、只受空气阻力可忽略的重力；g 默认 9.8，题目要求时取 10。',
        conv: ['长度', '时间', '速度'],
        calc: {
          inputs: [{ key: 't', label: '下落时间 t', unit: 's' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'h', label: '下落高度 h', unit: 'm' }, { key: 'v', label: '落地速度 v', unit: 'm/s' }],
          fn: i => ({ h: 0.5 * i.g * i.t * i.t, v: i.g * i.t })
        }
      }
    ]
  },
  {
    id: 'm2', name: '相互作用', intro: '重力、弹力、摩擦力与力的合成分解。',
    formulas: [
      {
        name: '重力', expr: 'G = mg',
        symbols: [['G', '重力', 'N'], ['m', '质量', 'kg'], ['g', '重力加速度', 'm/s²']],
        condition: '在地球表面附近。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'G', label: '重力 G', unit: 'N' }],
          fn: i => ({ G: i.m * i.g })
        }
      },
      {
        name: '胡克定律', expr: 'F = kx',
        symbols: [['F', '弹力', 'N'], ['k', '劲度系数', 'N/m'], ['x', '形变量（伸长/压缩量）', 'm']],
        condition: 'x 是弹簧形变量，不是弹簧总长；在弹性限度内成立。',
        conv: ['长度', '力'],
        calc: {
          inputs: [{ key: 'k', label: '劲度系数 k', unit: 'N/m' }, { key: 'x', label: '形变量 x', unit: 'm' }],
          outputs: [{ key: 'F', label: '弹力 F', unit: 'N' }],
          fn: i => ({ F: i.k * i.x })
        }
      },
      {
        name: '滑动摩擦力', expr: 'f = μN',
        symbols: [['f', '滑动摩擦力', 'N'], ['μ', '动摩擦因数', '—'], ['N', '正压力', 'N']],
        condition: '接触面粗糙且发生相对滑动；N 是垂直于接触面的压力，不一定等于重力。',
        conv: ['力'],
        calc: {
          inputs: [{ key: 'mu', label: '动摩擦因数 μ', unit: '—' }, { key: 'N', label: '正压力 N', unit: 'N' }],
          outputs: [{ key: 'f', label: '摩擦力 f', unit: 'N' }],
          fn: i => ({ f: i.mu * i.N })
        }
      },
      {
        name: '力的合成（正交分解）', expr: 'F = √(Fx² + Fy²)',
        symbols: [['F', '合力大小', 'N'], ['Fx', '水平分力', 'N'], ['Fy', '竖直分力', 'N']],
        condition: '两个分力互相垂直时使用。',
        conv: ['力'],
        calc: {
          inputs: [{ key: 'Fx', label: '水平分力 Fx', unit: 'N' }, { key: 'Fy', label: '竖直分力 Fy', unit: 'N' }],
          outputs: [{ key: 'F', label: '合力 F', unit: 'N' }],
          fn: i => ({ F: Math.sqrt(i.Fx * i.Fx + i.Fy * i.Fy) })
        }
      },
      {
        name: '斜面重力分力', expr: 'G₁ = mg·sinθ，G₂ = mg·cosθ',
        symbols: [['G₁', '沿斜面分力', 'N'], ['G₂', '垂直斜面分力', 'N'], ['m', '质量', 'kg'], ['θ', '斜面倾角', '°']],
        condition: 'θ 为斜面与水平面的夹角。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'theta', label: '倾角 θ', unit: '°' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'G1', label: '沿斜面 G₁', unit: 'N' }, { key: 'G2', label: '垂直斜面 G₂', unit: 'N' }],
          fn: i => { const r = rad(i.theta); return { G1: i.m * i.g * Math.sin(r), G2: i.m * i.g * Math.cos(r) } }
        }
      }
    ]
  },
  {
    id: 'm3', name: '牛顿运动定律', intro: '第二定律、超重失重与第三定律。',
    formulas: [
      {
        name: '牛顿第二定律', expr: 'F合 = ma',
        symbols: [['F合', '合外力', 'N'], ['m', '质量', 'kg'], ['a', '加速度', 'm/s²']],
        condition: '加速度方向与合外力方向相同；F合 是所有外力的矢量和。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }],
          outputs: [{ key: 'F', label: '合外力 F合', unit: 'N' }],
          fn: i => ({ F: i.m * i.a })
        }
      },
      {
        name: '由力求加速度', expr: 'a = F合 / m',
        symbols: [['a', '加速度', 'm/s²'], ['F合', '合外力', 'N'], ['m', '质量', 'kg']],
        condition: '质量不能为 0。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'F', label: '合外力 F合', unit: 'N' }, { key: 'm', label: '质量 m', unit: 'kg' }],
          outputs: [{ key: 'a', label: '加速度 a', unit: 'm/s²' }],
          fn: i => ({ a: i.F / i.m })
        }
      },
      {
        name: '超重（加速上升 / 减速下降）', expr: 'N = m(g + a)',
        symbols: [['N', '支持力（视重）', 'N'], ['m', '质量', 'kg'], ['a', '加速度大小', 'm/s²'], ['g', '重力加速度', 'm/s²']],
        condition: '加速度方向向上时处于超重状态，N 大于 mg。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'N', label: '支持力 N', unit: 'N' }],
          fn: i => ({ N: i.m * (i.g + i.a) })
        }
      },
      {
        name: '失重（加速下降 / 减速上升）', expr: 'N = m(g − a)',
        symbols: [['N', '支持力（视重）', 'N'], ['m', '质量', 'kg'], ['a', '加速度大小', 'm/s²'], ['g', '重力加速度', 'm/s²']],
        condition: '加速度方向向下时处于失重状态；a = g 为完全失重。',
        conv: ['质量', '力'],
        calc: {
          inputs: [{ key: 'm', label: '质量 m', unit: 'kg' }, { key: 'a', label: '加速度 a', unit: 'm/s²' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'N', label: '支持力 N', unit: 'N' }],
          fn: i => ({ N: i.m * (i.g - i.a) })
        }
      },
      {
        name: '牛顿第三定律', expr: '作用力 = 反作用力',
        symbols: [['—', '大小相等、方向相反', '—'], ['—', '作用在两个不同物体上', '—']],
        condition: '作用力与反作用力不能相互平衡；平衡力作用在同一物体上，注意区分。',
        conv: [],
        calc: null
      }
    ]
  },
  {
    id: 'm4', name: '曲线运动', intro: '平抛运动与圆周运动规律。',
    formulas: [
      {
        name: '平抛：水平方向', expr: 'x = v₀t',
        symbols: [['x', '水平位移', 'm'], ['v₀', '水平初速度', 'm/s'], ['t', '运动时间', 's']],
        condition: '水平方向匀速直线运动。',
        conv: ['长度', '时间', '速度'],
        calc: {
          inputs: [{ key: 'v0', label: '水平初速度 v₀', unit: 'm/s' }, { key: 't', label: '时间 t', unit: 's' }],
          outputs: [{ key: 'x', label: '水平位移 x', unit: 'm' }],
          fn: i => ({ x: i.v0 * i.t })
        }
      },
      {
        name: '平抛：竖直方向', expr: 'y = ½gt²，v_y = gt',
        symbols: [['y', '竖直下落距离', 'm'], ['v_y', '竖直分速度', 'm/s'], ['t', '运动时间', 's'], ['g', '重力加速度', 'm/s²']],
        condition: '竖直方向自由落体。',
        conv: ['长度', '时间', '速度'],
        calc: {
          inputs: [{ key: 't', label: '时间 t', unit: 's' }, { key: 'g', label: '重力加速度 g', unit: 'm/s²' }],
          outputs: [{ key: 'y', label: '竖直距离 y', unit: 'm' }, { key: 'vy', label: '竖直速度 v_y', unit: 'm/s' }],
          fn: i => ({ y: 0.5 * i.g * i.t * i.t, vy: i.g * i.t })
        }
      },
      {
        name: '平抛：合速度', expr: 'v = √(v₀² + v_y²)，tanθ = v_y / v₀',
        symbols: [['v', '合速度', 'm/s'], ['v₀', '水平初速度', 'm/s'], ['v_y', '竖直分速度', 'm/s'], ['θ', '速度与水平方向夹角', '°']],
        condition: 'θ 为合速度方向与水平方向的夹角。',
        conv: ['速度'],
        calc: {
          inputs: [{ key: 'v0', label: '水平初速度 v₀', unit: 'm/s' }, { key: 'vy', label: '竖直速度 v_y', unit: 'm/s' }],
          outputs: [{ key: 'v', label: '合速度 v', unit: 'm/s' }, { key: 'tan', label: 'tanθ', unit: '—' }],
          fn: i => ({ v: Math.sqrt(i.v0 * i.v0 + i.vy * i.vy), tan: i.vy / i.v0 })
        }
      },
      {
        name: '圆周：线速度与角速度', expr: 'v = ωr',
        symbols: [['v', '线速度', 'm/s'], ['ω', '角速度', 'rad/s'], ['r', '圆周半径', 'm']],
        condition: '匀速圆周运动。',
        conv: ['长度', '速度'],
        calc: {
          inputs: [{ key: 'w', label: '角速度 ω', unit: 'rad/s' }, { key: 'r', label: '半径 r', unit: 'm' }],
          outputs: [{ key: 'v', label: '线速度 v', unit: 'm/s' }],
          fn: i => ({ v: i.w * i.r })
        }
      },
      {
        name: '向心加速度', expr: 'aₙ = v²/r = ω²r',
        symbols: [['aₙ', '向心加速度', 'm/s²'], ['v', '线速度', 'm/s'], ['r', '圆周半径', 'm']],
        condition: '方向指向圆心，只改变速度方向。',
        conv: ['长度', '速度'],
        calc: {
          inputs: [{ key: 'v', label: '线速度 v', unit: 'm/s' }, { key: 'r', label: '半径 r', unit: 'm' }],
          outputs: [{ key: 'an', label: '向心加速度 aₙ', unit: 'm/s²' }],

  '质量': { units: { 't': 1000, 'kg': 1, 'g': 0.001, 'mg': 1e-6 } },

  '动量/冲量': { units: { 'kg·m/s': 1, 'N·s': 1 } }

/* ================= 状态与工具 ================= */
const state = { view: 'list', moduleId: null, convMid: null, convFi: null, convCat: null }

function $(id) { return document.getElementById(id) }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])) }
function rad(deg) { return deg * Math.PI / 180 }
function num(v) { const n = parseFloat(v); return isNaN(n) ? NaN : n }

function fmt(x) {
  if (typeof x !== 'number' || !isFinite(x)) return null
  if (x === 0) return '0'
  const abs = Math.abs(x)
  if (abs >= 1e5 || abs < 1e-3) return x.toExponential(3)
  return String(Number(x.toPrecision(4)))
}

function findFormula(mid, fi) {
  const m = MODULES.find(x => x.id === mid)
  return m ? { m, f: m.formulas[fi] } : null
}

/* ================= 渲染 ================= */
function render() {
  const app = $('app')
  if (state.view === 'list') app.innerHTML = renderList()
  else if (state.view === 'module') app.innerHTML = renderDetail()
  else if (state.view === 'const') app.innerHTML = renderConst()
  else if (state.view === 'conv') app.innerHTML = renderConv()
  window.scrollTo(0, 0)
}

function renderList() {
  const cards = MODULES.map((m, i) => `
    <div class="module-card" onclick="goModule('${m.id}')">
      <div class="module-no">${String(i + 1).padStart(2, '0')}</div>
      <div class="module-body">
        <h2>${esc(m.name)}</h2>
        <p>${esc(m.intro)}</p>
      </div>
      <div class="module-arrow">›</div>
    </div>`).join('')
  return `
    <div class="topbar">
      <h1>高中力学速算</h1>
      <button class="ghost-btn" onclick="goConst()">常量</button>
    </div>
    <div class="header"><p>公式速查 · 代入计算 · 公式旁进入单位换算（第一版：力学核心）</p></div>
    <div class="module-list">${cards}</div>
    <p class="note">说明：公式与单位按高中物理常用口径整理；计算结果保留 4 位有效数字。后续可再扩展电磁学、热学等板块。</p>`
}

function renderDetail() {
  const m = MODULES.find(x => x.id === state.moduleId)
  if (!m) return renderList()
  const cards = m.formulas.map((f, fi) => renderFormula(m.id, fi, f)).join('')
  return `
    <div class="back-bar topbar">
      <button class="back-btn" onclick="goList()">‹ 返回模块</button>
      <div class="detail-title">${esc(m.name)}</div>
    </div>
    <p class="detail-intro">${esc(m.intro)}</p>
    ${cards}`
}

function renderFormula(mid, fi, f) {
  const syms = f.symbols.map(s => `
    <div class="symbol"><span class="sym">${esc(s[0])}</span><span class="mean">${esc(s[1])}</span><span class="unit">${esc(s[2])}</span></div>`).join('')
  const convBtn = (f.conv && f.conv.length) ? `<button class="conv-link" onclick="openConv('${mid}', ${fi})">换算</button>` : ''
  const calc = f.calc ? renderCalc(mid, fi, f.calc) : ''
  return `
    <div class="formula-card">
      <div class="formula-head">
        <div class="formula-name">${esc(f.name)}</div>
        ${convBtn}
      </div>
      <div class="formula-expr">${esc(f.expr)}</div>
      <div class="symbols">${syms}</div>
      <div class="condition">${esc(f.condition)}</div>
      ${calc}
    </div>`
}

function renderCalc(mid, fi, calc) {
  const inputs = calc.inputs.map(inp => `
    <div class="field">
      <label>${esc(inp.label)}（${esc(inp.unit)}）</label>
      <input type="number" step="any" id="inp-${mid}-${fi}-${inp.key}" placeholder="0">
    </div>`).join('')
  return `
    <div class="calc">
      <div class="calc-grid">${inputs}</div>
      <button class="calc-btn" onclick="runCalc('${mid}', ${fi})">计算</button>
      <div class="calc-result" id="res-${mid}-${fi}"></div>
    </div>`
}

function renderConst() {
  const rows = CONSTANTS.map(c => `
    <div class="const-row"><span class="k">${esc(c[0])}</span><span class="v">${esc(c[1])}<br><span class="note-inline">${esc(c[3])}</span></span><span class="u">${esc(c[2])}</span></div>`).join('')
  return `
    <div class="topbar">
      <button class="back-btn" onclick="goList()">‹ 返回</button>
      <h1>常用常量</h1>
    </div>
    <div class="const-table">${rows}</div>
    <p class="note">单位换算在对应公式卡片右上角的「换算」入口中按公式类别进入。</p>`
}

function renderConv() {
  const found = findFormula(state.convMid, state.convFi)
  if (!found) return renderList()
  const { m, f } = found
  const cats = f.conv
  if (!state.convCat || !cats.includes(state.convCat)) state.convCat = cats[0]
  const chips = cats.map(c => `<button class="chip ${c === state.convCat ? 'active' : ''}" onclick="changeConvCat('${esc(c)}')">${esc(c)}</button>`).join('')
  const unitOptions = Object.keys(UNITS[state.convCat].units).map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('')
  return `
    <div class="topbar">
      <button class="back-btn" onclick="backFromConv()">‹ 返回 ${esc(m.name)}</button>
    </div>
    <div class="conv-context">
      <div class="formula-name">${esc(f.name)}</div>
      <div class="expr">${esc(f.expr)}</div>
    </div>
    <div class="chips">${chips}</div>
    <div class="conv-card">
      <div class="conv-row">
        <label>数值（${esc(state.convCat)}）</label>
        <input type="number" step="any" id="conv-value" placeholder="输入数值">
      </div>
      <div class="conv-two">
        <div class="field"><label>从</label><select id="conv-from">${unitOptions}</select></div>
        <div class="field"><label>到</label><select id="conv-to">${unitOptions}</select></div>
      </div>
      <button class="calc-btn" onclick="runConvert()">换算</button>
      <div class="calc-result" id="conv-result"></div>
    </div>`
}

/* ================= 交互 ================= */
function goList() { state.view = 'list'; state.moduleId = null; render() }
function goModule(id) { state.view = 'module'; state.moduleId = id; render() }
function goConst() { state.view = 'const'; render() }
function openConv(mid, fi) { state.view = 'conv'; state.convMid = mid; state.convFi = fi; state.convCat = null; render() }
function backFromConv() { state.view = 'module'; state.moduleId = state.convMid; render() }

function runCalc(mid, fi) {
  const found = findFormula(mid, fi)
  if (!found) return
  const calc = found.f.calc
  const raw = {}
  for (const inp of calc.inputs) {
    const el = $(`inp-${mid}-${fi}-${inp.key}`)
    raw[inp.key] = num(el.value)
  }
  const resEl = $(`res-${mid}-${fi}`)
  const bad = Object.values(raw).some(v => isNaN(v))
  if (bad) { resEl.innerHTML = '<span class="err">请填写完整的有效数值</span>'; return }

  let out
  try { out = calc.fn(raw) } catch (e) { out = null }
  const parts = calc.outputs.map(o => {
    const val = out ? out[o.key] : NaN
    const txt = fmt(val)
    return txt === null ? null : `${esc(o.label)}：<span class="ok">${txt}</span> ${esc(o.unit)}`
  })
  if (parts.some(p => p === null)) { resEl.innerHTML = '<span class="err">结果不成立，检查输入（如除零、根号内为负）</span>'; return }
  resEl.innerHTML = parts.join('<br>')
}

function changeConvCat(cat) {
  state.convCat = cat
  const units = Object.keys(UNITS[cat].units)
  $('conv-from').innerHTML = units.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('')
  $('conv-to').innerHTML = units.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('')
  $('conv-result').innerHTML = ''
}

function runConvert() {
  const v = num($('conv-value').value)
  const from = $('conv-from').value
  const to = $('conv-to').value
  const resEl = $('conv-result')
  if (isNaN(v)) { resEl.innerHTML = '<span class="err">请输入有效数值</span>'; return }
  const table = UNITS[state.convCat].units
  const base = v * table[from]
  const out = base / table[to]
  const txt = fmt(out)
  resEl.innerHTML = txt === null
    ? '<span class="err">换算结果不成立</span>'
    : `${esc(v)} ${esc(from)} = <span class="ok">${txt}</span> ${esc(to)}`
}

render()
</script>
</body>
</html>
